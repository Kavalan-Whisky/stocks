<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>台股即時看板 · TW MARKET</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Share+Tech+Mono&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   VARIABLES & RESET
   ============================================================ */
:root {
  --bg:        #070b11;
  --surface:   #0c1220;
  --surface2:  #101828;
  --surface3:  #162035;
  --surface4:  #1c2842;
  --border:    #192840;
  --border2:   #233658;
  --green:     #00e87a;
  --green-dim: rgba(0,232,122,0.10);
  --red:       #ff2d5e;
  --red-dim:   rgba(255,45,94,0.10);
  --blue:      #00aaff;
  --blue-dim:  rgba(0,170,255,0.08);
  --amber:     #ffaa00;
  --text:      #b8cce0;
  --text-dim:  #4a6070;
  --text-mute: #283848;
  --text-hi:   #ddeeff;
  --mono:      'Share Tech Mono', monospace;
  --sans:      'Noto Sans TC', sans-serif;
  --logo:      'Orbitron', sans-serif;
}
/* ── LIGHT MODE ── */
body.light {
  --bg:        #f0f4f8;
  --surface:   #ffffff;
  --surface2:  #f5f7fa;
  --surface3:  #e8edf3;
  --surface4:  #dde4ed;
  --border:    #cdd5e0;
  --border2:   #b0bfcf;
  --green:     #00a855;
  --green-dim: rgba(0,168,85,0.10);
  --red:       #e0173f;
  --red-dim:   rgba(224,23,63,0.10);
  --blue:      #0077cc;
  --blue-dim:  rgba(0,119,204,0.08);
  --amber:     #cc7700;
  --text:      #374151;
  --text-dim:  #7a8fa6;
  --text-mute: #aab8c8;
  --text-hi:   #111827;
}
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  min-height: 100vh;
  overflow-x: hidden;
  zoom: var(--ui-scale, 1);
}
body::before {
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:
    linear-gradient(rgba(0,170,255,.022) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,170,255,.022) 1px, transparent 1px);
  background-size: 48px 48px;
  transition: opacity .3s;
}
body.light::before { opacity: 0; }
body::after {
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background: radial-gradient(ellipse at 50% 0%, transparent 60%, rgba(0,0,0,.6) 100%);
  transition: opacity .3s;
}
body.light::after { opacity: 0; }

/* ============================================================
   SCROLLBAR
   ============================================================ */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--text-dim)}

/* ============================================================
   HEADER
   ============================================================ */
header {
  position:sticky;top:0;z-index:200;
  background: rgba(7,11,17,.96);
  backdrop-filter: blur(24px);
  border-bottom: 1px solid var(--border);
  transition: background .3s;
}
body.light header { background: rgba(240,244,248,.97); }
.header-bar {
  display:flex;align-items:center;gap:14px;
  padding:0 24px;height:58px;
}
.logo {
  font-family:var(--logo);font-weight:900;
  font-size:16px;letter-spacing:3px;
  color:var(--blue);
  text-shadow:0 0 24px rgba(0,170,255,.6);
  white-space:nowrap;user-select:none;
}
.logo em { color:var(--green); font-style:normal; }
.divider { width:1px; height:24px; background:var(--border); flex-shrink:0; }
.mkt-status {
  display:flex;align-items:center;gap:7px;
  font-family:var(--mono);font-size:11px;white-space:nowrap;
}
.pulse-dot {
  width:7px;height:7px;border-radius:50%;
  background:var(--green);
  box-shadow:0 0 0 0 rgba(0,232,122,.4);
  animation:pulse 2s infinite;
}
.pulse-dot.off{background:var(--text-dim);animation:none;box-shadow:none}
@keyframes pulse{
  0%,100%{box-shadow:0 0 0 0 rgba(0,232,122,.5)}
  50%{box-shadow:0 0 0 5px rgba(0,232,122,0)}
}
#statusText{color:var(--text-dim)}
#statusText.open{color:var(--green)}
.clock{font-family:var(--mono);font-size:13px;color:var(--text-dim);white-space:nowrap}
.spacer{flex:1}

/* SEARCH */
.search-wrap{position:relative;display:flex;align-items:center;gap:8px}
#searchInput{
  background:var(--surface2);
  border:1px solid var(--border2);
  color:var(--text-hi);
  font-family:var(--sans);font-size:13px;
  border-radius:6px;padding:8px 14px 8px 32px;
  width:260px;outline:none;
  transition:border-color .2s,box-shadow .2s,width .2s;
}
#searchInput::placeholder{color:var(--text-dim);font-size:12px}
#searchInput:focus{border-color:var(--blue);box-shadow:0 0 0 2px rgba(0,170,255,.15);width:320px}
.search-icon{
  position:absolute;left:10px;top:50%;transform:translateY(-50%);
  color:var(--text-dim);font-size:13px;pointer-events:none;
}

/* SEARCH DROPDOWN */
.search-dd{
  position:absolute;top:calc(100% + 6px);left:0;right:0;
  background:var(--surface2);
  border:1px solid var(--border2);
  border-radius:8px;
  max-height:380px;overflow-y:auto;
  box-shadow:0 12px 40px rgba(0,0,0,.6);
  z-index:300;display:none;
}
.search-dd.show{display:block}
.sd-item{
  display:flex;align-items:center;gap:10px;
  padding:10px 14px;cursor:pointer;
  border-bottom:1px solid var(--border);
  transition:background .15s;
}
.sd-item:last-child{border-bottom:none}
.sd-item:hover,.sd-item.hl{background:var(--surface3)}
.sd-code{font-family:var(--mono);font-size:12px;color:var(--blue);min-width:54px}
.sd-name{flex:1;font-size:13px;color:var(--text-hi)}
.sd-cat{
  font-size:10px;padding:2px 8px;border-radius:10px;
  background:var(--surface3);border:1px solid var(--border);
  color:var(--text-dim);
}
.sd-add{
  font-size:10px;color:var(--green);
  font-family:var(--mono);letter-spacing:1px;
}
.sd-empty{
  padding:20px;text-align:center;
  color:var(--text-dim);font-family:var(--mono);font-size:12px;
}

/* REFRESH */
.refresh-wrap{
  display:flex;align-items:center;gap:8px;
  font-family:var(--mono);font-size:11px;color:var(--text-dim);white-space:nowrap;
}
.refresh-btn{
  background:none;border:1px solid var(--border2);
  color:var(--text-dim);border-radius:5px;
  padding:5px 9px;font-size:11px;cursor:pointer;
  transition:all .2s;font-family:var(--mono);
}
.refresh-btn:hover{border-color:var(--blue);color:var(--blue)}
.refresh-btn.spinning{color:var(--green);border-color:var(--green)}
#countdown{display:inline-block;min-width:18px;text-align:right;color:var(--text)}

/* THEME TOGGLE */
.theme-btn{
  background:none;
  border:1px solid var(--border2);
  color:var(--text-dim);
  border-radius:5px;
  padding:5px 10px;
  font-size:15px;
  cursor:pointer;
  transition:all .2s;
  line-height:1;
}
.theme-btn:hover{border-color:var(--blue);color:var(--blue)}

/* FONT SIZE CONTROL */
.fz-wrap{
  display:inline-flex;align-items:center;gap:0;
  border:1px solid var(--border2);border-radius:5px;
  overflow:hidden;
}
.fz-btn{
  background:none;border:none;
  color:var(--text-dim);
  font-family:var(--sans);
  font-weight:700;cursor:pointer;
  padding:5px 9px;
  transition:all .15s;
  line-height:1;
}
.fz-btn:hover{background:var(--surface3);color:var(--blue)}
.fz-btn.minus{font-size:11px}
.fz-btn.plus{font-size:14px}
.fz-btn.reset{
  font-size:9px;font-family:var(--mono);
  padding:5px 7px;color:var(--text-mute);
  border-left:1px solid var(--border);
  border-right:1px solid var(--border);
}
.fz-btn:disabled{opacity:.3;cursor:not-allowed}

/* ============================================================
   TICKER TAPE
   ============================================================ */
.ticker-tape {
  overflow:hidden;
  border-top:1px solid var(--border);
  background: linear-gradient(90deg, var(--surface) 0%, transparent 5%, transparent 95%, var(--surface) 100%);
  height:30px;display:flex;align-items:center;position:relative;
}
.ticker-tape::before,.ticker-tape::after{
  content:'';position:absolute;top:0;bottom:0;width:60px;z-index:1;
}
.ticker-tape::before{left:0;background:linear-gradient(90deg,var(--surface),transparent)}
.ticker-tape::after{right:0;background:linear-gradient(270deg,var(--surface),transparent)}
.ticker-scroll{
  display:flex;gap:0;
  animation:ticker 90s linear infinite;
  white-space:nowrap;will-change:transform;
}
.ticker-scroll:hover{animation-play-state:paused}
@keyframes ticker{
  0%{transform:translateX(0)} 100%{transform:translateX(-50%)}
}
.tick-item{
  display:inline-flex;align-items:center;gap:6px;
  padding:0 28px;font-family:var(--mono);font-size:11px;
  border-right:1px solid var(--border);
}
.tick-code{color:var(--text-dim)}
.tick-price{font-weight:bold}
.tick-pct{font-size:10px}
.up{color:var(--green)}
.dn{color:var(--red)}
.flat{color:var(--text-dim)}

/* ============================================================
   MAIN
   ============================================================ */
main{
  position:relative;z-index:1;
  max-width:1720px;margin:0 auto;
  padding:22px 24px 48px;
}

/* Mode toggle */
.mode-row{
  display:flex;align-items:center;gap:8px;margin-bottom:14px;
  font-family:var(--mono);font-size:11px;
}
.mode-btn{
  background:var(--surface2);border:1px solid var(--border);
  color:var(--text-dim);border-radius:5px;
  padding:6px 14px;font-family:var(--sans);font-size:12px;
  cursor:pointer;transition:all .2s;
}
.mode-btn:hover{border-color:var(--border2);color:var(--text)}
.mode-btn.active{
  background:var(--blue);border-color:var(--blue);
  color:#000;font-weight:700;
}

/* Stats bar */
.stats-row{
  display:flex;align-items:center;flex-wrap:wrap;gap:10px;
  margin-bottom:18px;
  font-family:var(--mono);font-size:12px;
}
.stat-chip{
  display:flex;align-items:center;gap:6px;
  padding:5px 13px;border-radius:20px;
  background:var(--surface2);border:1px solid var(--border);
}
.sc-label{color:var(--text-dim)}
.sc-val{font-weight:bold;color:var(--text-hi)}
.sc-val.up{color:var(--green)}
.sc-val.dn{color:var(--red)}
.sc-val.amber{color:var(--amber)}

/* Category tabs */
.tabs{
  display:flex;flex-wrap:wrap;gap:6px;
  margin-bottom:18px;
}
.tab{
  background:none;border:1px solid var(--border);
  color:var(--text-dim);border-radius:5px;
  padding:6px 14px;font-size:12px;
  font-family:var(--sans);cursor:pointer;
  transition:all .2s;display:inline-flex;align-items:center;gap:6px;
}
.tab:hover{border-color:var(--border2);color:var(--text)}
.tab.active{
  background:var(--blue);border-color:var(--blue);
  color:#000;font-weight:700;
}
.tab .count{
  font-family:var(--mono);font-size:10px;opacity:.75;
}

/* Section label */
.section-title{
  font-family:var(--mono);font-size:11px;
  color:var(--text-dim);letter-spacing:2px;text-transform:uppercase;
  margin-bottom:14px;padding-left:2px;
  display:flex;align-items:center;justify-content:space-between;
}
.section-title .hint{
  font-family:var(--sans);font-size:11px;color:var(--text-mute);
  letter-spacing:0;text-transform:none;
}

/* Error banner */
.error-banner{
  background:rgba(255,45,94,.08);border:1px solid rgba(255,45,94,.2);
  color:var(--red);border-radius:8px;padding:12px 16px;
  font-family:var(--mono);font-size:12px;
  margin-bottom:16px;display:none;
}

/* ============================================================
   STOCK GRID
   ============================================================ */
.stock-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(340px,1fr));
  gap:14px;
}

/* ============================================================
   STOCK CARD
   ============================================================ */
.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:10px;
  padding:14px 15px;
  position:relative;overflow:hidden;
  transition:border-color .25s, transform .2s, box-shadow .2s;
}
.card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:var(--border2);transition:background .3s;
}
.card.card-up::before{background:var(--green)}
.card.card-dn::before{background:var(--red)}
.card.card-flat::before{background:var(--border2)}
.card:hover{transform:translateY(-2px);box-shadow:0 10px 40px rgba(0,0,0,.5)}
.card.card-up:hover{border-color:rgba(0,232,122,.25)}
.card.card-dn:hover{border-color:rgba(255,45,94,.25)}

.card.flash{animation:flash-anim .6s ease}
@keyframes flash-anim{
  0%{background:var(--surface)}
  30%{background:rgba(0,170,255,.06)}
  100%{background:var(--surface)}
}

/* Remove btn */
.rm-btn{
  position:absolute;top:8px;right:8px;
  background:none;border:none;color:var(--text-dim);
  font-size:13px;cursor:pointer;
  opacity:0;transition:opacity .15s,color .15s;
  padding:2px 6px;border-radius:4px;line-height:1;
}
.card:hover .rm-btn{opacity:.4}
.rm-btn:hover{opacity:1!important;color:var(--red)!important}

/* Card header */
.card-head{
  display:flex;align-items:flex-start;justify-content:space-between;
  margin-bottom:10px;padding-right:22px;
}
.c-code{font-family:var(--mono);font-size:12px;color:var(--text-dim);letter-spacing:.5px}
.c-name{font-size:16px;font-weight:700;color:var(--text-hi);margin-top:2px;line-height:1.3}
.c-tag{
  font-size:9px;padding:2px 8px;border-radius:20px;
  background:var(--surface3);border:1px solid var(--border);
  color:var(--text-dim);white-space:nowrap;flex-shrink:0;margin-top:2px;
}
.c-ex{
  font-family:var(--mono);font-size:9px;
  color:var(--text-mute);margin-left:6px;
}

/* Price row */
.price-row{
  display:flex;align-items:baseline;justify-content:space-between;
  gap:10px;margin-bottom:10px;
}
.c-price{
  font-family:var(--mono);
  font-size:30px;font-weight:bold;line-height:1;
  transition:color .3s;
}
.c-price.up{color:var(--green)}
.c-price.dn{color:var(--red)}
.c-price.flat{color:var(--text-hi)}
.c-price.none{color:var(--text-dim);font-size:22px}
.c-change{
  display:flex;flex-direction:column;align-items:flex-end;
  font-family:var(--mono);font-size:12px;line-height:1.3;
}
.c-change .arrow{font-size:13px;margin-right:3px}
.c-change.up{color:var(--green)}
.c-change.dn{color:var(--red)}
.c-change.flat{color:var(--text-dim)}
.c-change .pct{font-size:11px;opacity:.85}

/* OHLC + limits */
.ohlc{
  display:grid;grid-template-columns:repeat(6,1fr);
  gap:2px;margin-bottom:10px;
}
.ohlc-cell{text-align:center;padding:5px 2px;background:var(--surface2);border-radius:4px}
.ohlc-lbl{display:block;font-family:var(--mono);font-size:9px;color:var(--text-dim);margin-bottom:2px}
.ohlc-val{font-family:var(--mono);font-size:11px;color:var(--text)}
.ohlc-val.up{color:var(--green)}
.ohlc-val.dn{color:var(--red)}

/* Bid/Ask 5 levels */
.ba-wrap{
  display:grid;grid-template-columns:1fr 1fr;
  gap:8px;margin-bottom:10px;
}
.ba-side{
  background:var(--surface2);
  border-radius:6px;
  padding:6px 8px;
  border:1px solid var(--border);
}
.ba-side.buy{border-left:2px solid var(--green)}
.ba-side.sell{border-left:2px solid var(--red)}
.ba-head{
  font-family:var(--mono);font-size:9px;
  color:var(--text-dim);letter-spacing:1px;
  display:flex;justify-content:space-between;
  padding-bottom:4px;margin-bottom:4px;
  border-bottom:1px dashed var(--border);
}
.ba-head .label-buy{color:var(--green)}
.ba-head .label-sell{color:var(--red)}
.ba-row{
  display:flex;justify-content:space-between;align-items:center;
  font-family:var(--mono);font-size:11px;
  padding:2px 0;position:relative;
  z-index:1;
}
.ba-row .bar{
  position:absolute;top:0;bottom:0;
  z-index:-1;border-radius:2px;opacity:.18;
}
.ba-side.buy .bar{right:0;background:var(--green)}
.ba-side.sell .bar{left:0;background:var(--red)}
.ba-price{font-weight:bold;letter-spacing:.3px}
.ba-side.buy .ba-price{color:var(--green)}
.ba-side.sell .ba-price{color:var(--red)}
.ba-vol{color:var(--text-dim);font-size:10px}
.ba-empty{text-align:center;color:var(--text-mute);font-size:10px;padding:8px 0;font-family:var(--mono)}

/* Range bar */
.range-wrap{margin-bottom:10px}
.range-lims{
  display:flex;justify-content:space-between;
  font-family:var(--mono);font-size:9px;color:var(--text-dim);
  margin-bottom:4px;
}
.range-lims .mid{color:var(--text-mute)}
.range-track{
  height:5px;background:var(--surface3);border-radius:2px;
  position:relative;overflow:visible;
}
.range-fill{
  position:absolute;top:0;left:0;right:0;height:100%;
  background:linear-gradient(90deg,var(--red) 0%,#666 50%,var(--green) 100%);
  border-radius:2px;opacity:.4;
}
.range-y-mark{
  position:absolute;top:-3px;width:2px;height:11px;
  background:var(--text-dim);transform:translateX(-50%);
  opacity:.6;
}
.range-dot{
  position:absolute;top:-4px;
  width:13px;height:13px;border-radius:50%;
  background:#fff;
  box-shadow:0 0 8px rgba(255,255,255,.6);
  transform:translateX(-50%);
  transition:left .4s ease;
  border:2px solid var(--bg);
}

/* Footer */
.c-foot{
  display:flex;align-items:center;justify-content:space-between;
  padding-top:8px;border-top:1px solid var(--border);
  font-family:var(--mono);font-size:10px;color:var(--text-dim);
  gap:8px;flex-wrap:wrap;
}
.c-foot .group{display:flex;gap:10px}
.c-vol{color:var(--text)}
.c-tv{color:var(--blue)}
.c-time{color:var(--text-mute)}

/* Skeleton */
.skel{
  height:14px;border-radius:4px;
  background:linear-gradient(90deg,var(--surface2),var(--surface3),var(--surface2));
  background-size:300% 100%;animation:skel-anim 1.6s ease infinite;
}
@keyframes skel-anim{
  0%{background-position:100% 50%} 100%{background-position:-100% 50%}
}

/* Empty / browse list */
.empty{
  grid-column:1/-1;text-align:center;padding:60px 20px;
  font-family:var(--mono);font-size:13px;color:var(--text-dim);
}
.empty strong{display:block;font-size:28px;margin-bottom:8px;color:var(--text-mute)}
.empty .em-hint{display:block;margin-top:10px;font-size:11px;color:var(--text-mute)}

/* Browse list (compact) */
.browse-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
  gap:8px;
}
.browse-item{
  display:flex;align-items:center;gap:10px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:6px;
  padding:9px 12px;
  cursor:pointer;
  transition:all .15s;
}
.browse-item:hover{border-color:var(--blue);background:var(--surface2);transform:translateX(2px)}
.browse-item.in-list{opacity:.5;cursor:default}
.browse-item.in-list:hover{border-color:var(--border);transform:none}
.bi-code{font-family:var(--mono);font-size:12px;color:var(--blue);min-width:48px}
.bi-name{flex:1;font-size:13px;color:var(--text-hi)}
.bi-add{
  font-family:var(--mono);font-size:11px;color:var(--green);
  letter-spacing:1px;
}
.browse-item.in-list .bi-add{color:var(--text-mute);content:'已加'}

/* ============================================================
   FOOTER
   ============================================================ */
.page-foot{
  text-align:center;padding:20px 24px;
  font-family:var(--mono);font-size:10px;color:var(--text-dim);
  border-top:1px solid var(--border);
  position:relative;z-index:1;
}
.page-foot span{color:var(--text-mute)}

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media(max-width:900px){
  .header-bar{padding:0 14px;height:auto;flex-wrap:wrap;padding-top:10px;padding-bottom:10px;gap:10px}
  #searchInput{width:100%}
  .search-wrap{flex:1 1 100%;order:5}
  .refresh-wrap{order:4}
  main{padding:14px}
  .stock-grid{grid-template-columns:1fr 1fr}
  .ohlc{grid-template-columns:repeat(3,1fr)}
}
@media(max-width:540px){
  .stock-grid{grid-template-columns:1fr}
  .ohlc{grid-template-columns:repeat(3,1fr)}
  .browse-grid{grid-template-columns:1fr 1fr}
}

/* ============================================================
   TOAST
   ============================================================ */
.toast{
  position:fixed;bottom:24px;right:24px;z-index:9999;
  background:var(--surface3);border:1px solid var(--border2);
  color:var(--text);font-family:var(--mono);font-size:12px;
  padding:10px 16px;border-radius:8px;
  box-shadow:0 8px 32px rgba(0,0,0,.5);
  opacity:0;transform:translateY(10px);
  transition:all .3s;pointer-events:none;
}
.toast.show{opacity:1;transform:translateY(0)}
.toast.ok{border-color:rgba(0,232,122,.3);color:var(--green)}
.toast.err{border-color:rgba(255,45,94,.3);color:var(--red)}
</style>
</head>

<!-- ═══════════════════ HEADER ═══════════════════ -->
<header>
  <div class="header-bar">
    <div class="logo">TW<em>MARKET</em></div>
    <div class="divider"></div>

    <div class="mkt-status">
      <div class="pulse-dot" id="pulseDot"></div>
      <span id="statusText">檢查中</span>
    </div>

    <div class="clock" id="clock">--:--:--</div>

    <div class="spacer"></div>

    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" autocomplete="off"
             placeholder="搜尋股票代號或名稱 (e.g. 2330 / 台積電)"
             oninput="onSearchInput()"
             onkeydown="onSearchKey(event)"
             onfocus="onSearchInput()"
             onblur="setTimeout(()=>hideSearchDD(),200)">
      <div class="search-dd" id="searchDD"></div>
    </div>

    <button class="theme-btn" id="themeBtn" onclick="toggleTheme()" title="切換日/夜模式">🌙</button>

    <div class="fz-wrap" title="調整文字大小">
      <button class="fz-btn minus" onclick="changeFont(-1)">A−</button>
      <button class="fz-btn reset" onclick="changeFont(0)" id="fzReset">100%</button>
      <button class="fz-btn plus"  onclick="changeFont(1)">A+</button>
    </div>

    <div class="refresh-wrap">
      <span id="countdown">10</span>s
      <button class="refresh-btn" id="refreshBtn" onclick="manualRefresh()">⟳ 更新</button>
    </div>
  </div>

  <!-- Ticker tape -->
  <div class="ticker-tape">
    <div class="ticker-scroll" id="ticker">
      <span class="tick-item flat">載入行情中...</span>
    </div>
  </div>
</header>

<!-- ═══════════════════ MAIN ═══════════════════ -->
<main>
  <div class="error-banner" id="errorBanner">

  <div class="mode-row">
    <button class="mode-btn active" id="modeWatch" onclick="setMode('watch')">★ 自選追蹤</button>
    <button class="mode-btn" id="modeBrowse" onclick="setMode('browse')">⌕ 瀏覽全部</button>
    <div style="flex:1"></div>
    <span style="color:var(--text-mute);font-size:11px" id="modeHint"></span>

  <div class="stats-row" id="statsRow">

  <div class="tabs" id="tabs"></div>

  <div class="section-title" id="sectionTitle">
    <span>即時行情</span>
    <span class="hint" id="sectionHint"></span>

  <div id="grid" class="stock-grid"></div>
</main>

let mode         = 'watch';  // 'watch' or 'browse'
let countdown    = 10;
let isRefreshing = false;
let searchHL     = -1;   // highlighted dropdown index

const REFRESH_OPEN  = 10;   // seconds, market open
const REFRESH_CLOSE = 10;   // seconds, market closed (always 10s)

/* ============================================================
   HELPERS
   ============================================================ */
function twNow(){ return new Date(new Date().toLocaleString('en-US',{timeZone:'Asia/Taipei'})); }
function isMktOpen(){
  const t=twNow(),d=t.getDay(),m=t.getHours()*60+t.getMinutes();
  return d>=1&&d<=5 && m>=540&&m<810;
}
function fmtTime(t){
  t=t||twNow();
  return t.toLocaleTimeString('zh-TW',{hour12:false,hour:'2-digit',minute:'2-digit',second:'2-digit'});
}
function fp(v,dec=2){
  if(v===null||v===undefined||v===''||v==='-')return null;
  const n=parseFloat(v);
  return isNaN(n)?null:+n.toFixed(dec);
}
function fmtVol(v){
  if(v===null||v===undefined||v===''||v==='-')return '--';
  const n=parseInt(v);
  if(isNaN(n))return '--';
  if(n>=100000)return (n/10000).toFixed(1)+'萬張';
  if(n>=10000)return (n/10000).toFixed(2)+'萬張';
  return n.toLocaleString()+'張';
}
function fmtQty(v){
  if(v===null||v===undefined||v===''||v==='-')return '--';
  const n=parseInt(v);
  if(isNaN(n))return '--';
  if(n>=10000)return (n/10000).toFixed(1)+'萬';
  if(n>=1000)return (n/1000).toFixed(1)+'K';
  return String(n);
}
function clsOf(chg){
  if(chg===null||chg===undefined)return 'flat';
  return chg>0?'up':chg<0?'dn':'flat';
}
function arrowOf(chg){
  if(chg===null||chg===undefined)return '–';
  return chg>0?'▲':chg<0?'▼':'–';
}
function pct(chg,base){
  if(chg===null||!base)return null;
  return chg/base*100;
}
function signFmt(n){
  if(n===null||n===undefined||isNaN(n))return '--';
  return (n>=0?'+':'')+n.toFixed(2);
}

/* Split underscore-separated string of 5 values from TWSE */
function splitFive(s){
  if(!s)return [];
  return s.split('_').filter(x=>x!==''&&x!=='-');
}

/* ============================================================
   TOAST
   ============================================================ */
function toast(msg,type=''){
  const el=document.getElementById('toast');
  el.textContent=msg;
  el.className='toast show '+(type||'');
  clearTimeout(el._t);
  el._t=setTimeout(()=>el.className='toast',2400);
}

/* ============================================================
   THEME
   ============================================================ */
let isLight = false;
function applyTheme(){
  document.body.classList.toggle('light', isLight);
  const btn = document.getElementById('themeBtn');
  if(btn) btn.textContent = isLight ? '🌞' : '🌙';
  try{ localStorage.setItem('twmkt_theme', isLight ? 'light' : 'dark'); }catch(_){}
}
function toggleTheme(){
  isLight = !isLight;
  applyTheme();
}
function loadTheme(){
  try{
    const s = localStorage.getItem('twmkt_theme');
    if(s) isLight = (s === 'light');
  }catch(_){}
  applyTheme();
}

/* ============================================================
   FONT SCALE
   ============================================================ */
const FZ_STEPS = [0.75, 0.85, 1.0, 1.15, 1.30, 1.50, 1.75];
let fzIdx = 2; // default 1.0
function applyFont(){
  const scale = FZ_STEPS[fzIdx];
  document.body.style.setProperty('--ui-scale', scale);
  const el = document.getElementById('fzReset');
  if(el) el.textContent = Math.round(scale*100)+'%';
  try{ localStorage.setItem('twmkt_fz', String(fzIdx)); }catch(_){}
}
function changeFont(dir){
  if(dir===0){ fzIdx = 2; }
  else if(dir<0){ fzIdx = Math.max(0, fzIdx-1); }
  else { fzIdx = Math.min(FZ_STEPS.length-1, fzIdx+1); }
  applyFont();
}
function loadFont(){
  try{
    const s = localStorage.getItem('twmkt_fz');
    if(s!==null){
      const n = parseInt(s,10);
      if(!isNaN(n) && n>=0 && n<FZ_STEPS.length) fzIdx = n;
    }
  }catch(_){}
  applyFont();
}

/* ============================================================
   PERSISTENCE
   ============================================================ */
function saveWatch(){
  try{ localStorage.setItem('twmkt_v3',JSON.stringify(watchlist)); }catch(_){}
}
function loadWatch(){
  try{
    const s=localStorage.getItem('twmkt_v3');
    if(s){
      const arr=JSON.parse(s);
      if(Array.isArray(arr)&&arr.length){watchlist=arr;return;}
    }
  }catch(_){}
  watchlist=[...DEFAULT_WATCH];
}

/* ============================================================
   FETCH — TWSE MIS
   ============================================================ */
const PROXIES=[
  u=>`https://corsproxy.io/?${encodeURIComponent(u)}`,
  u=>`https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,
  u=>`https://thingproxy.freeboard.io/fetch/${u}`,
];

async function fetchTWSE(codes){
  // codes: array of code strings
  const items = codes.map(c=>{
    const info=STOCK_DB[c];
    const ex=info?info.e:'tse';
    return `${ex}_${c}.tw`;
  });
  const exCh = items.join('|');
  const base = `https://mis.twse.com.tw/stock/api/getStockInfo.jsp?ex_ch=${exCh}&json=1&delay=0&_=${Date.now()}`;

  // Direct
  try{
    const r=await fetch(base,{signal:AbortSignal.timeout(5000)});
    if(r.ok){const d=await r.json();if(d.msgArray?.length)return d.msgArray;}
  }catch(_){}

  // Proxies
  for(const proxy of PROXIES){
    try{
      const r=await fetch(proxy(base),{signal:AbortSignal.timeout(9000)});
      if(r.ok){
        const txt=await r.text();
        const d=JSON.parse(txt);
        if(d.msgArray?.length)return d.msgArray;
      }
    }catch(_){}
  }
  return null;
}

async function doRefresh(){
  if(isRefreshing||watchlist.length===0)return;
  isRefreshing=true;
  document.getElementById('refreshBtn').classList.add('spinning');

  const BATCH=25;
  const results=[];
  let anyOk=false;

  for(let i=0;i<watchlist.length;i+=BATCH){
    const batch=watchlist.slice(i,i+BATCH);
    const data=await fetchTWSE(batch);
    if(data){anyOk=true;results.push(...data);}
  }

  document.getElementById('errorBanner').style.display=anyOk?'none':'block';

  if(results.length){
    results.forEach(item=>{
      const code=item.c;
      const prev=cache[code];
      const flash = prev && (prev.z!==item.z || prev.tv!==item.tv);
      cache[code]=item;
      if(flash)cache[code]._flash=true;
    });
    if(mode==='watch'){
      renderGrid();
      renderStats();
    }
    renderTicker();
    document.getElementById('lastUpdate').textContent=fmtTime();
  }

  isRefreshing=false;
  setTimeout(()=>document.getElementById('refreshBtn').classList.remove('spinning'),300);
}

function manualRefresh(){
  countdown = isMktOpen() ? REFRESH_OPEN : REFRESH_CLOSE;
  doRefresh();
}

/* ============================================================
   SEARCH (autocomplete dropdown)
   ============================================================ */
function searchMatch(q){
  q=q.trim();
  if(!q)return [];
  const qLower=q.toLowerCase();
  const isNum=/^[0-9A-Z]+$/i.test(q);
  const results=[];
  for(const code in STOCK_DB){
    const info=STOCK_DB[code];
    const codeL=code.toLowerCase();
    const nameL=info.n.toLowerCase();
    let score=0;
    if(isNum){
      if(codeL===qLower) score=100;
      else if(codeL.startsWith(qLower)) score=80;
      else if(codeL.includes(qLower)) score=40;
    }
    if(nameL===qLower) score=Math.max(score,95);
    else if(nameL.startsWith(qLower)) score=Math.max(score,70);
    else if(nameL.includes(qLower)) score=Math.max(score,30);
    if(score>0)results.push({code,info,score});
  }
  results.sort((a,b)=>b.score-a.score);
  return results.slice(0,15);
}

function onSearchInput(){
  const q=document.getElementById('searchInput').value;
  searchHL=-1;
  if(!q.trim()){hideSearchDD();return;}
  const matches=searchMatch(q);
  const dd=document.getElementById('searchDD');
  if(!matches.length){
    dd.innerHTML=`<div class="sd-empty">無符合「${esc(q)}」的股票，按 Enter 直接加入代號</div>`;
    dd.classList.add('show');
    return;
  }
  dd.innerHTML=matches.map((m,i)=>{
    const inList=watchlist.includes(m.code);
    return `<div class="sd-item" data-code="${m.code}" onmousedown="pickSearch('${m.code}')">
      <span class="sd-code">${m.code}</span>
      <span class="sd-name">${esc(m.info.n)}</span>
      <span class="sd-cat">${m.info.c}</span>
      <span class="sd-add">${inList?'已加':'+ 加入'}</span>
    </div>`;
  }).join('');
  dd.classList.add('show');
}

function onSearchKey(e){
  const dd=document.getElementById('searchDD');
  const items=dd.querySelectorAll('.sd-item');
  if(e.key==='ArrowDown'){
    e.preventDefault();
    if(!items.length)return;
    searchHL=(searchHL+1)%items.length;
    updateHL(items);
  }else if(e.key==='ArrowUp'){
    e.preventDefault();
    if(!items.length)return;
    searchHL=(searchHL-1+items.length)%items.length;
    updateHL(items);
  }else if(e.key==='Enter'){
    e.preventDefault();
    if(searchHL>=0&&items[searchHL]){
      pickSearch(items[searchHL].dataset.code);
    }else{
      // Try first match, or raw input as code
      const q=e.target.value.trim();
      const matches=searchMatch(q);
      if(matches.length) pickSearch(matches[0].code);
      else if(q) addRawCode(q);
    }
  }else if(e.key==='Escape'){
    hideSearchDD();
    e.target.blur();
  }
}

function updateHL(items){
  items.forEach((it,i)=>it.classList.toggle('hl',i===searchHL));
  if(items[searchHL]) items[searchHL].scrollIntoView({block:'nearest'});
}

function hideSearchDD(){
  document.getElementById('searchDD').classList.remove('show');
  searchHL=-1;
}

async function pickSearch(code){
  document.getElementById('searchInput').value='';
  hideSearchDD();
  await addToWatch(code);
}

async function addRawCode(raw){
  const code=raw.replace(/[^0-9A-Za-z]/g,'').toUpperCase();
  if(!code){toast('代號格式有誤','err');return;}
  document.getElementById('searchInput').value='';
  hideSearchDD();
  await addToWatch(code);
}

async function addToWatch(code){
  if(watchlist.includes(code)){
    toast(`${code} 已在自選清單中`,'err');
    return;
  }
  // Ensure exists in STOCK_DB (so we know the exchange & name)
  if(!STOCK_DB[code]){
    STOCK_DB[code]={n:code,c:'自選',e:'tse'};
  }
  watchlist.push(code);
  saveWatch();

  if(mode==='watch'){
    renderTabs();
    renderGrid();
  }else{
    renderGrid(); // browse mode highlights it
  }

  // Fetch immediately
  const data=await fetchTWSE([code]);
  if(data&&data.length){
    cache[code]=data[0];
    if(data[0].n && STOCK_DB[code].n===code) STOCK_DB[code].n=data[0].n;
  }
  if(mode==='watch'){
    renderGrid();
    renderStats();
  }
  renderTicker();
  toast(`已加入 ${STOCK_DB[code].n}`,'ok');
}

function removeStock(code,ev){
  if(ev)ev.stopPropagation();
  watchlist=watchlist.filter(c=>c!==code);
  saveWatch();
  renderTabs();
  renderGrid();
  renderStats();
  renderTicker();
  toast(`已移除 ${STOCK_DB[code]?.n||code}`);
}

/* ============================================================
   MODE
   ============================================================ */
function setMode(m){
  mode=m;
  activeCat='全部';
  document.getElementById('modeWatch').classList.toggle('active',m==='watch');
  document.getElementById('modeBrowse').classList.toggle('active',m==='browse');
  document.getElementById('modeHint').textContent=
    m==='watch' ? '顯示自選清單即時行情'
                : '瀏覽完整股票資料庫，點擊即可加入自選';
  renderTabs();
  renderGrid();
}

/* ============================================================
   CATEGORIES
   ============================================================ */
function getCategoriesForWatch(){
  const set=new Set();
  watchlist.forEach(c=>{
    const info=STOCK_DB[c];
    if(info)set.add(info.c);
  });
  const ordered=CAT_ORDER.filter(c=>set.has(c));
  const extras=[...set].filter(c=>!CAT_ORDER.includes(c));
  return ['全部',...ordered,...extras];
}
function getCategoriesForBrowse(){
  const set=new Set();
  for(const code in STOCK_DB){set.add(STOCK_DB[code].c);}
  const ordered=CAT_ORDER.filter(c=>set.has(c));
  const extras=[...set].filter(c=>!CAT_ORDER.includes(c));
  return ['全部',...ordered,...extras];
}
function countInCat(cat){
  if(mode==='watch'){
    if(cat==='全部')return watchlist.length;
    return watchlist.filter(c=>STOCK_DB[c]?.c===cat).length;
  }else{
    if(cat==='全部')return Object.keys(STOCK_DB).length;
    return Object.keys(STOCK_DB).filter(c=>STOCK_DB[c].c===cat).length;
  }
}

function renderTabs(){
  const cats = mode==='watch' ? getCategoriesForWatch() : getCategoriesForBrowse();
  if(!cats.includes(activeCat)) activeCat='全部';
  document.getElementById('tabs').innerHTML=
    cats.map(c=>{
      const n=countInCat(c);
      return `<button class="tab${c===activeCat?' active':''}" onclick="setTab('${esc(c)}')">${c}<span class="count">${n}</span></button>`;
    }).join('');
}
function setTab(cat){
  activeCat=cat;
  renderTabs();
  renderGrid();
}

/* ============================================================
   STATS
   ============================================================ */
function renderStats(){
  if(mode==='browse'){
    document.getElementById('statsRow').innerHTML=`
      <div class="stat-chip"><span class="sc-label">資料庫</span><span class="sc-val">${Object.keys(STOCK_DB).length} 檔</span></div>
      <div class="stat-chip"><span class="sc-label">自選</span><span class="sc-val">${watchlist.length} 檔</span></div>
    `;
    return;
  }
  const total=watchlist.length;
  let up=0,dn=0,sumPct=0,cnt=0;
  watchlist.forEach(c=>{
    const d=cache[c];
    if(!d)return;
    const p=fp(d.z),y=fp(d.y);
    if(p===null||y===null)return;
    if(p>y)up++;else if(p<y)dn++;
    const pv=pct(p-y,y);
    if(pv!==null){sumPct+=pv;cnt++;}
  });
  const fl=total-up-dn;
  const avg=cnt?(sumPct/cnt).toFixed(2):'--';
  const avgCls=cnt&&sumPct>=0?'up':(cnt?'dn':'amber');
  document.getElementById('statsRow').innerHTML=`
    <div class="stat-chip"><span class="sc-label">追蹤</span><span class="sc-val">${total} 檔</span></div>
    <div class="stat-chip"><span class="sc-label">上漲</span><span class="sc-val up">▲ ${up}</span></div>
    <div class="stat-chip"><span class="sc-label">下跌</span><span class="sc-val dn">▼ ${dn}</span></div>
    <div class="stat-chip"><span class="sc-label">持平</span><span class="sc-val amber">– ${fl}</span></div>
    <div class="stat-chip"><span class="sc-label">平均漲幅</span><span class="sc-val ${avgCls}">${cnt?(sumPct>=0?'+':'')+avg+'%':'--'}</span></div>
  `;
}

/* ============================================================
   TICKER
   ============================================================ */
function renderTicker(){
  const list=watchlist.length?watchlist:Object.keys(STOCK_DB).slice(0,30);
  const items=list.map(c=>{
    const info=STOCK_DB[c]||{n:c};
    const d=cache[c];
    if(!d)return `<span class="tick-item flat"><span class="tick-code">${c}</span><span>${esc(info.n)}</span><span class="tick-price">--</span></span>`;
    const p=fp(d.z),y=fp(d.y);
    const chg=p!==null&&y!==null?p-y:null;
    const pctv=pct(chg,y);
    const cls=clsOf(chg);
    return `<span class="tick-item ${cls}">
      <span class="tick-code">${c}</span>
      <span>${esc(d.n||info.n)}</span>
      <span class="tick-price">${p!==null?p.toFixed(2):'--'}</span>
      <span class="tick-pct">${pctv!==null?(pctv>=0?'+':'')+pctv.toFixed(2)+'%':'--'}</span>
    </span>`;
  }).join('');
  document.getElementById('ticker').innerHTML=items+items;
}

/* ============================================================
   GRID — WATCH MODE (full detail cards)
   ============================================================ */
function renderGrid(){
  renderTabs();

  if(mode==='browse'){
    renderBrowseGrid();
    return;
  }

  const filtered = activeCat==='全部'
    ? watchlist
    : watchlist.filter(c=>STOCK_DB[c]?.c===activeCat);

  const cnt=filtered.length;
  document.getElementById('sectionTitle').querySelector('span').textContent=
    `${activeCat==='全部'?'自選清單':activeCat} · ${cnt} 檔`;
  document.getElementById('sectionHint').textContent=
    cnt ? '即時報價 · 含五檔買賣' : '';

  if(!cnt){
    document.getElementById('grid').className='stock-grid';
    document.getElementById('grid').innerHTML=
      `<div class="empty"><strong>∅</strong>此分類暫無股票
       <span class="em-hint">使用上方搜尋欄加入，或切換到 [瀏覽全部]</span></div>`;
    return;
  }

  document.getElementById('grid').className='stock-grid';
  document.getElementById('grid').innerHTML=filtered.map(c=>cardHTML(c)).join('');

  // Apply flash animation
  filtered.forEach(c=>{
    if(cache[c]?._flash){
      const el=document.getElementById('c-'+c);
      if(el){el.classList.add('flash');setTimeout(()=>el.classList.remove('flash'),700);}
      delete cache[c]._flash;
    }
  });
}

/* ============================================================
   GRID — BROWSE MODE (compact list)
   ============================================================ */
function renderBrowseGrid(){
  let list=Object.keys(STOCK_DB);
  if(activeCat!=='全部') list=list.filter(c=>STOCK_DB[c].c===activeCat);

  document.getElementById('sectionTitle').querySelector('span').textContent=
    `${activeCat==='全部'?'全部股票':activeCat} · ${list.length} 檔`;
  document.getElementById('sectionHint').textContent='點擊即可加入自選';

  // Sort by code
  list.sort();

  document.getElementById('grid').className='browse-grid';
  if(!list.length){
    document.getElementById('grid').innerHTML=
      `<div class="empty"><strong>∅</strong>此分類無資料</div>`;
    return;
  }
  document.getElementById('grid').innerHTML=list.map(c=>{
    const info=STOCK_DB[c];
    const inList=watchlist.includes(c);
    return `<div class="browse-item ${inList?'in-list':''}" onclick="${inList?'':`pickSearch('${c}')`}">
      <span class="bi-code">${c}</span>
      <span class="bi-name">${esc(info.n)}</span>
      <span class="bi-add">${inList?'★ 已加':'+ 加入'}</span>
    </div>`;
  }).join('');
}

/* ============================================================
   CARD HTML — full detail with 5-level bid/ask
   ============================================================ */
function cardHTML(code){
  const info=STOCK_DB[code]||{n:code,c:'自選',e:'tse'};
  const d=cache[code];

  if(!d){
    return `<div class="card" id="c-${code}">
      <button class="rm-btn" onclick="removeStock('${code}',event)">✕</button>
      <div class="card-head">
        <div><div class="c-code">${code} <span class="c-ex">${info.e.toUpperCase()}</span></div><div class="c-name">${esc(info.n)}</div></div>
        <div class="c-tag">${info.c}</div>
      </div>
      <div class="skel" style="height:36px;margin-bottom:8px"></div>
      <div class="skel" style="height:14px;width:60%;margin-bottom:14px"></div>
      <div class="skel" style="height:28px;margin-bottom:10px"></div>
      <div class="skel" style="height:88px;margin-bottom:10px"></div>
      <div class="skel" style="height:12px"></div>
    </div>`;
  }

  const p   = fp(d.z);
  const y   = fp(d.y);
  const o   = fp(d.o);
  const hi  = fp(d.h);
  const lo  = fp(d.l);
  const up  = fp(d.u);       // limit up
  const dw  = fp(d.w);       // limit down
  const chg = (p!==null&&y!==null)?+(p-y).toFixed(2):null;
  const pctv= pct(chg,y);
  const cls = clsOf(chg);

  const priceStr   = p!==null ? p.toFixed(2) : '--';
  const priceClass = p===null?'none':cls;

  const chgStr = chg!==null ? signFmt(chg) : '--';
  const pctStr = pctv!==null ? (pctv>=0?'+':'')+pctv.toFixed(2)+'%' : '--';

  /* === 5-level bid/ask === */
  const bids = splitFive(d.b);   // buy prices
  const bvols= splitFive(d.g);   // buy volumes
  const asks = splitFive(d.a);   // sell prices
  const avols= splitFive(d.f);   // sell volumes

  const maxVol = Math.max(
    ...bvols.map(v=>+v||0),
    ...avols.map(v=>+v||0),
    1
  );

  let buyHTML='';
  if(bids.length){
    buyHTML = bids.slice(0,5).map((bp,i)=>{
      const v=+(bvols[i]||0);
      const w=(v/maxVol*100).toFixed(0);
      return `<div class="ba-row">
        <span class="bar" style="width:${w}%"></span>
        <span class="ba-price">${(+bp).toFixed(2)}</span>
        <span class="ba-vol">${fmtQty(v)}</span>
      </div>`;
    }).join('');
  }else{
    buyHTML=`<div class="ba-empty">─ 無委買 ─</div>`;
  }

  let sellHTML='';
  if(asks.length){
    // Show asks ascending from inside (closest to current price first → highest)
    // TWSE returns ascending (a1<a2<a3...) — keep order
    sellHTML = asks.slice(0,5).map((ap,i)=>{
      const v=+(avols[i]||0);
      const w=(v/maxVol*100).toFixed(0);
      return `<div class="ba-row">
        <span class="bar" style="width:${w}%"></span>
        <span class="ba-price">${(+ap).toFixed(2)}</span>
        <span class="ba-vol">${fmtQty(v)}</span>
      </div>`;
    }).join('');
  }else{
    sellHTML=`<div class="ba-empty">─ 無委賣 ─</div>`;
  }

  /* === Range bar with prev-close marker === */
  let rangeHTML='';
  if(p!==null && hi!==null && lo!==null){
    const lowB  = Math.min(lo, y!==null?y:lo, p);
    const highB = Math.max(hi, y!==null?y:hi, p);
    const span  = highB - lowB || 1;
    const dotPos = ((p-lowB)/span*100);
    const yPos   = y!==null ? ((y-lowB)/span*100) : null;
    rangeHTML=`<div class="range-wrap">
      <div class="range-lims">
        <span>L ${lo.toFixed(2)}</span>
        <span class="mid">${y!==null?'昨 '+y.toFixed(2):''}</span>
        <span>H ${hi.toFixed(2)}</span>
      </div>
      <div class="range-track">
        <div class="range-fill"></div>
        ${yPos!==null?`<div class="range-y-mark" style="left:${yPos.toFixed(1)}%"></div>`:''}
        <div class="range-dot" style="left:${dotPos.toFixed(1)}%"></div>
      </div>
    </div>`;
  }

  const updateT = d.t ? d.t.slice(0,8) : '--';
  const name    = d.n || info.n;

  return `<div class="card card-${cls}" id="c-${code}">
    <button class="rm-btn" onclick="removeStock('${code}',event)">✕</button>

    <div class="card-head">
      <div>
        <div class="c-code">${code}<span class="c-ex">${(d.ex||info.e).toUpperCase()}</span></div>
        <div class="c-name">${esc(name)}</div>
      </div>
      <div class="c-tag">${info.c}</div>
    </div>

    <div class="price-row">
      <div class="c-price ${priceClass}">${priceStr}</div>
      <div class="c-change ${cls}">
        <div><span class="arrow">${arrowOf(chg)}</span>${chgStr}</div>
        <div class="pct">${pctStr}</div>
      </div>
    </div>

    <div class="ohlc">
      <div class="ohlc-cell"><span class="ohlc-lbl">昨收</span><span class="ohlc-val">${y!==null?y.toFixed(2):'--'}</span></div>
      <div class="ohlc-cell"><span class="ohlc-lbl">開盤</span><span class="ohlc-val">${o!==null?o.toFixed(2):'--'}</span></div>
      <div class="ohlc-cell"><span class="ohlc-lbl">最高</span><span class="ohlc-val up">${hi!==null?hi.toFixed(2):'--'}</span></div>
      <div class="ohlc-cell"><span class="ohlc-lbl">最低</span><span class="ohlc-val dn">${lo!==null?lo.toFixed(2):'--'}</span></div>
      <div class="ohlc-cell"><span class="ohlc-lbl">漲停</span><span class="ohlc-val up">${up!==null?up.toFixed(2):'--'}</span></div>
      <div class="ohlc-cell"><span class="ohlc-lbl">跌停</span><span class="ohlc-val dn">${dw!==null?dw.toFixed(2):'--'}</span></div>
    </div>

    <div class="ba-wrap">
      <div class="ba-side buy">
        <div class="ba-head"><span class="label-buy">委買 BID</span><span>量</span></div>
        ${buyHTML}
      </div>
      <div class="ba-side sell">
        <div class="ba-head"><span class="label-sell">委賣 ASK</span><span>量</span></div>
        ${sellHTML}
      </div>
    </div>

    ${rangeHTML}

    <div class="c-foot">
      <span class="group">
        <span class="c-vol">📊 ${fmtVol(d.v)}</span>
        ${d.tv?`<span class="c-tv">單筆 ${fmtQty(d.tv)}</span>`:''}
      </span>
      <span class="c-time">⏱ ${updateT}</span>
    </div>
  </div>`;
}

/* ============================================================
   ESCAPE
   ============================================================ */
function esc(s){
  if(s===null||s===undefined)return '';
  return String(s).replace(/[&<>"']/g,m=>(
    {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]
  ));
}

/* ============================================================
   CLOCK & COUNTDOWN
   ============================================================ */
function tick(){
  document.getElementById('clock').textContent=fmtTime();

  const open=isMktOpen();
  const dot=document.getElementById('pulseDot');
  const txt=document.getElementById('statusText');
  dot.className='pulse-dot'+(open?'':' off');
  txt.textContent=open?'市場交易中':'市場已收盤';
  txt.className=open?'open':'';

  countdown--;
  if(countdown<=0){
    countdown = open ? REFRESH_OPEN : REFRESH_CLOSE;
    doRefresh();
  }
  document.getElementById('countdown').textContent=countdown;
}

/* ============================================================
   INIT
   ============================================================ */
function init(){
  loadTheme();
  loadFont();
  loadWatch();
  setMode('watch');
  renderStats();

  // Skeleton ticker
  document.getElementById('ticker').innerHTML=
    watchlist.map(c=>{
      const info=STOCK_DB[c]||{n:c};
      return `<span class="tick-item flat"><span class="tick-code">${c}</span><span>${esc(info.n)}</span><span class="tick-price">--</span></span>`;
    }).join('').repeat(2);

  setInterval(tick,1000);
  doRefresh();
}

window.addEventListener('DOMContentLoaded',init);

/* Refresh when tab regains focus */
document.addEventListener('visibilitychange',()=>{
  if(!document.hidden)doRefresh();
});
</script>
</body>
</html>
